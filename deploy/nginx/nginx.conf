server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # API
    location /health { proxy_pass http://api:8000; }
    location /scan { proxy_pass http://api:8000; }
    location /scan-tool { proxy_pass http://api:8000; }
    location /audit { proxy_pass http://api:8000; }
    location /v1/ { proxy_pass http://api:8000; }
    location /docs { proxy_pass http://api:8000; }
    location /redoc { proxy_pass http://api:8000; }
    location /openapi.json { proxy_pass http://api:8000; }

    # Dashboard
    location / {
        proxy_pass http://dashboard:80;
    }
}

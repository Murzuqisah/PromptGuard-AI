[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptguard"
version = "1.0.0"
description = "Python SDK for PromptGuard AI — enterprise agent firewall"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://github.com/Murzuqisah/PromptGuard-AI"
Documentation = "https://github.com/Murzuqisah/PromptGuard-AI/blob/main/docs/INTEGRATION.md"
